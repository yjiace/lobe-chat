name: Sync Fork with Upstream

on:
  schedule:
    # 设置一个定时触发器。以下示例表示每天凌晨3点 (UTC) 执行一次。
    # 你可以根据需要调整 Cron 表达式。
    # 例如 '0 * * * *' 表示每小时执行一次。
    - cron: '0 3 * * *'
  workflow_dispatch: # 允许你从 Actions 页面手动触发此工作流

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream repository
        uses: repo-sync/github-sync@v2 # 使用这个预构建的 Action
        with:
          # **必需：** 将此 URL 替换为你要同步的 *上游* (原始) 仓库的 URL
          source_repo: "https://github.com/OriginalOwner/original-repo.git"

          # **必需：** 上游仓库中你想要同步的源分支名称 (通常是 main 或 master)
          source_branch: "main"

          # **必需：** 你的 fork 仓库中要更新的目标分支名称 (通常与 source_branch 相同)
          destination_branch: "main"

          # 使用 GitHub Actions 自动提供的令牌来获得推送到你的 fork 的权限
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # **可选：** 如果你想强制覆盖你的 fork 分支 (确保它完全匹配上游，丢弃任何 fork 上的差异)
          # 请取消下面一行的注释。在你这种“仅更新”的场景下，这可能是安全的，
          # 但请确保你真的不需要 fork 上的任何提交。
          # force: true
